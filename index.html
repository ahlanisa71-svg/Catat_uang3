.tg{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 6px 16px -8px rgba(29,78,95,.4);transition:transform .2s,background .3s}
.tg:active{transform:scale(.92)}
.tg svg{width:19px;height:19px;grid-area:1/1;transition:transform .45s cubic-bezier(.4,1.3,.5,1),opacity .25s}
.tg .sun{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .tg .sun{opacity:1;transform:none}
:root[data-theme="dark"] .tg .moon{opacity:0;transform:rotate(90deg) scale(.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tg .sun{opacity:1;transform:none}:root:not([data-theme="light"]) .tg .moon{opacity:0;transform:rotate(90deg) scale(.4)}}
.tgl{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:16px;padding:4px;gap:2px}
.tgl button{padding:10px 4px;border-radius:12px;font-size:13px;font-weight:500;color:var(--mute);transition:background .25s,color .25s}
.tgl button.on{background:var(--teal);color:#fff}
:root[data-theme="dark"] .tgl button.on{background:var(--ora)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tgl button.on{background:var(--ora)}}
body,#app,.card,.row,.tile,nav,.sheet,.f{transition:background-color .3s,color .3s,border-color .3s}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border:0}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.badge{display:inline-block;background:var(--peach);color:#c0561a;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600}
:root[data-theme="dark"] .badge{color:var(--ora)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:var(--ora)}}
.logo{font-family:'Dancing Script','Brush Script MT',cursive;font-size:34px;font-weight:700;color:var(--ora);text-align:center;margin:8px 0 2px}
.cl{list-style:none;padding:0;font-size:13px;line-height:1.6}.cl li{padding-left:16px;position:relative;margin-bottom:6px}.cl li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--ora)}
.pol h3{font-size:14px;font-weight:600;margin:16px 0 4px}.pol h3:first-child{margin-top:0}.pol p{font-size:13px;line-height:1.65;color:var(--mute)}

/* ===== Transisi halus ===== */
@keyframes vInU{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes vItemU{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
#view.in-u{animation:vInU .8s cubic-bezier(.2,.8,.2,1) both}
#view.in-u :is(.list>*,.grid>*,.card,.tile,.bar,h2,.empty,.row){animation-name:vItemU;animation-duration:.85s}
@keyframes vIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes vInR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes vInL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes vItem{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vFade{from{opacity:0}to{opacity:1}}
#view.in-t{animation:vIn .38s cubic-bezier(.2,.8,.2,1) both}
#view.in-r{animation:vInR .38s cubic-bezier(.2,.8,.2,1) both}
#view.in-l{animation:vInL .38s cubic-bezier(.2,.8,.2,1) both}
#view[class*=in-] :is(.list>*,.grid>*,.card,.tile,.bar,h2,.empty){animation:vItem .45s cubic-bezier(.2,.8,.2,1) both}
#view[class*=in-] :is(.list,.grid)>:nth-child(2),#view[class*=in-]>.card:nth-of-type(2){animation-delay:.04s}
#view[class*=in-] :is(.list,.grid)>:nth-child(3){animation-delay:.08s}
#view[class*=in-] :is(.list,.grid)>:nth-child(4){animation-delay:.12s}
#view[class*=in-] :is(.list,.grid)>:nth-child(5){animation-delay:.16s}
#view[class*=in-] :is(.list,.grid)>:nth-child(6){animation-delay:.20s}
#view[class*=in-] :is(.list,.grid)>:nth-child(7){animation-delay:.24s}
#view[class*=in-] :is(.list,.grid)>:nth-child(n+8){animation-delay:.28s}
#view[class*=in-] .bar i u{transform-origin:left;animation:vBar .8s .15s cubic-bezier(.2,.8,.2,1) both}
button,.row,.tile,.chip,.cta{transition:transform .15s ease,background-color .25s,color .25s,box-shadow .25s,opacity .2s}
.row:active,.tile:active,.chip:active,.cta:active,.btns button:active{transform:scale(.97)}
.row:hover{box-shadow:0 8px 20px -10px rgba(29,78,95,.4)}
nav button svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
nav button.on svg{transform:translateY(-2px) scale(1.12)}
nav button span{transition:color .25s}
.scrim.show{animation:vFade .22s ease-out}
.sheet{animation:up .34s cubic-bezier(.2,.9,.25,1)!important}
.toast{transform:translate(-50%,10px);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.25,1)}
.toast.show{transform:translate(-50%,0)}
.tt,.tt *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}
@media(prefers-reduced-motion:reduce){#view,#view *{animation:none!important}.sheet,.scrim.show{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><button class="tg" id="tg" data-toggletheme aria-label="Ganti tema terang atau gelap"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast" role="status"></div>
  <div id="auth"></div>
</div>
<script>
/* ===== Model data & penyimpanan (v2) =====
   items   : transaksi {id,type(in|out|transfer),amount,categoryId,walletId,toWalletId?,date,note,updatedAt,deleted?}
   cats    : kategori {id,name,type(in|out),color}
   wallets : dompet {id,name,kind,initial}
   settings: {currency,theme}
   Saldo dompet = saldo awal + transaksi valid (tidak dihapus). Transfer memindahkan saldo, bukan pemasukan/pengeluaran.
   Data v1 lama otomatis dimigrasi. Untuk database online, ganti Repo.store dengan objek berisi all()/saveAll(). */
const LocalStore={
  key:'catatuang:v2',old:'catatuang:v1',
  async all(){try{
    const s=JSON.parse(localStorage.getItem(this.key));if(s&&Array.isArray(s.items))return s;
    
  }catch(e){}return null},
  async saveAll(db){try{localStorage.setItem(this.key,JSON.stringify(db))}catch(e){}}
};
const Repo={
  store:LocalStore,items:[],cats:[],wallets:[],settings:{},budgets:[],goals:[],bills:[],shop:[],
  async load(){
    const s=await this.store.all();
    this.cats=(s&&s.cats)||defCats();this.wallets=(s&&s.wallets&&s.wallets.length&&s.wallets)||defWallets();
    this.settings={currency:'IDR',theme:'auto',...((s&&s.settings)||{})};
    this.mt=(s&&s.mt)||0;this.items=s?s.items:[];['budgets','goals','bills','shop'].forEach(k=>this[k]=(s&&s[k])||[]);this.normalize();await this.persist(true);
  },
  normalize(){this.items.forEach(t=>{
    if(!t.categoryId&&t.type!=='transfer')t.categoryId=t.type+'-'+String(t.category||'lainnya').toLowerCase();
    if(!t.walletId)t.walletId=this.wallets[0].id;delete t.category;t.createdAt=t.createdAt||Date.now()})},
  dump(){return{v:2,mt:this.mt||0,items:this.items,cats:this.cats,wallets:this.wallets,settings:this.settings,budgets:this.budgets,goals:this.goals,bills:this.bills,shop:this.shop}},
  persist(keep){if(!keep){this.mt=Date.now();Sync.schedule()}return this.store.saveAll(this.dump())},
  live(){return this.items.filter(t=>!t.deleted)},
  walletBal(w){return this.live().reduce((a,t)=>t.type==='transfer'
    ?a+(t.toWalletId===w.id?t.amount:0)-(t.walletId===w.id?t.amount:0)
    :t.walletId!==w.id?a:a+(t.type==='in'?t.amount:-t.amount),w.initial||0)},
  async upsert(t){
    t.updatedAt=Date.now();delete t.seed;
    const i=this.items.findIndex(x=>x.id===t.id);
    if(i>=0)this.items[i]=t;else this.items.push(t);
    await this.persist();
  },
  async remove(id){
    const t=this.items.find(x=>x.id===id);
    if(t){t.deleted=true;t.updatedAt=Date.now();await this.persist()}
  }
};

/* ===== Util ===== */
const $=s=>document.querySelector(s);
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const PAL=['#f4a64e','#1d4e5f','#d9774a','#5b8a99','#e0b04a','#3aa58a','#8a9ba2'];
const defCats=()=>[['out','Makan','#f4a64e'],['out','Transport','#1d4e5f'],['out','Belanja','#d9774a'],['out','Tagihan','#5b8a99'],['out','Hiburan','#e0b04a'],['out','Lainnya','#8a9ba2'],['in','Gaji','#1f7a63'],['in','Bonus','#3aa58a'],['in','Lainnya','#8a9ba2']]
  .map(([type,name,color])=>({id:type+'-'+name.toLowerCase(),name,type,color}));
const defWallets=()=>[{id:'w-tunai',name:'Tunai',kind:'tunai',initial:0}];
const catOf=t=>t.type==='transfer'?{name:'Transfer',color:'#5b8a99'}:Repo.cats.find(c=>c.id===t.categoryId)||{name:'Lainnya',color:'#8a9ba2'};
const wn=id=>(Repo.wallets.find(w=>w.id===id)||{name:'Dompet'}).name;
const walOf=t=>({name:t.type==='transfer'?wn(t.walletId)+' → '+wn(t.toWalletId):wn(t.walletId)});
const catsOf=type=>Repo.cats.filter(c=>c.type===type&&!c.deleted);
const colorOf=t=>catOf(t).color;
const applyTheme=()=>{const r=document.documentElement,t=Repo.settings.theme;r.classList.add('tt');clearTimeout(applyTheme.t);applyTheme.t=setTimeout(()=>r.classList.remove('tt'),500);t==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t)};
const today=()=>iso(new Date());
const monthKey=s=>s.slice(0,7);
const longDay=s=>parse(s).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
function seed(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return iso(x)};
  const mk=(type,amount,category,note,date)=>({id:uid(),type,amount,categoryId:type+'-'+category.toLowerCase(),walletId:'w-tunai',note,date,seed:true,createdAt:Date.now(),updatedAt:Date.now()});
  return[mk('in',5000000,'Gaji','Gaji bulanan',d(0)),mk('out',35000,'Makan','Makan siang',d(0)),
    mk('out',20000,'Transport','Ojek ke kantor',d(0)),mk('out',250000,'Tagihan','Listrik',d(1)),
    mk('out',120000,'Belanja','Belanja mingguan',d(2)),mk('out',60000,'Hiburan','Nonton film',d(4))];
}
function stats(prefix){
  const l=Repo.live().filter(t=>monthKey(t.date)===prefix);
  const inc=l.filter(t=>t.type==='in').reduce((a,t)=>a+t.amount,0);
  const out=l.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0);
  return{inc,out,bal:inc-out,list:l};
}
const sortTx=l=>l.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);

/* ===== State ===== */
const S={tab:'home',sub:'',sel:today(),q:'',filter:'all'};
const ICONS={
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-2 8v9h14v-9z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="4"/><rect x="7" y="11" width="2.4" height="6" rx="1" fill="var(--bg)"/><rect x="11" y="7" width="2.4" height="10" rx="1" fill="var(--bg)"/><rect x="15" y="13" width="2.4" height="4" rx="1" fill="var(--bg)"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>'
};
function renderNav(){
  const b=(k,i,l)=>`<button class="${S.tab===k?'on':''}" data-tab="${k}" aria-label="${l}">${ICONS[i]}<span>${l}</span></button>`;
  $('#nav').innerHTML=b('home','home','Beranda')+b('hist','cal','Transaksi')+
    `<button class="plus" data-add aria-label="Tambah transaksi">${ICONS.plus}</button>`+
    b('stat','chart','Laporan')+b('more','more','Lainnya');
}

/* ===== Layar ===== */
function txRow(t){
  const sign=t.type==='in'?'+':t.type==='out'?'−':'⇄ ';
  return `<button class="row ${t.type}" data-edit="${t.id}">
    <span class="dot" style="background:${colorOf(t)}">${esc(catOf(t).name[0])}</span>
    <span class="t">${esc(t.note||catOf(t).name)}<small>${esc(catOf(t).name)} · ${esc(walOf(t).name)} · ${longDay(t.date)}</small></span>
    <span class="a ${t.type==='in'?'in-t':t.type==='out'?'out-t':''}">${sign}${rp(t.amount)}</span></button>`;
}
const cicilRow=b=>`<div class="search" style="margin:12px 0 0"><input class="f" id="c-${b.id}" data-m inputmode="numeric" placeholder="Cicilan (Rp)" aria-label="Cicilan ${esc(b.name)}"><button class="chip on" data-cicil="${b.id}">Cicil</button></div>`;
const debtors=()=>Repo.bills.filter(b=>Array.isArray(b.payments)&&billKind(b)==='piutang').map(b=>({b,i:dueInfo(b),r:debtRemain(b)})).sort((x,y)=>(x.r<=0)-(y.r<=0)||x.i.o-y.i.o||(x.b.due||'').localeCompare(y.b.due||''));
function openWaEditor(){
  $('#sheet').innerHTML=`<h2 style="margin:0">Isi pesan WhatsApp</h2><p class="note" style="margin:6px 0 10px">Pesan pengingat tagihan. Kata dalam kurung kurawal diisi otomatis: <b>{nama}</b> <b>{barang}</b> <b>{jumlah}</b> <b>{total}</b> <b>{terbayar}</b> <b>{sisa}</b> <b>{jatuh_tempo}</b></p>
  <textarea id="wt" aria-label="Isi pesan WhatsApp" style="height:200px;font-size:13px;line-height:1.5">${esc((Repo.settings&&Repo.settings.waTpl)||WA_DEF)}</textarea>
  <div class="btns"><button data-savewa>Simpan</button><button class="warn" data-resetwa>Kembalikan standar</button></div>
  <button class="cta" data-close style="background:var(--line);color:var(--ink);margin-top:10px">Tutup</button>`;
  $('#scrim').classList.add('show')}
function openWaPicker(){
  const d=debtors().filter(x=>x.r>0);if(!d.length){toast('Belum ada orang yang berhutang');return}
  const rows=d.map(({b,i,r})=>{const w=waLink(b),inner=`<span class="t">${esc(b.name)}<small style="white-space:normal">${esc(b.item||'-')}${b.qty?' × '+Number(b.qty).toLocaleString('id-ID'):''} · Sisa ${rp(r)}${w?'':' · <span style="color:#d64545">Belum ada nomor WA</span>'}</small></span>${w?'<span class="chip on">Kirim</span>':''}`,k=esc((b.name+' '+(b.address||'')+' '+(b.item||'')).toLowerCase());
    return w?`<a class="row" data-n="${k}" href="${w}" target="_blank" rel="noopener" data-close style="text-decoration:none;color:inherit">${inner}</a>`:`<div class="row" data-n="${k}" style="opacity:.6">${inner}</div>`}).join('');
  $('#sheet').innerHTML=`<h2 style="margin:0">Ingatkan via WhatsApp</h2><p class="note" style="margin:6px 0 0">Pilih orang yang mau diingatkan. WhatsApp terbuka dengan pesan siap kirim, tinggal ketuk Kirim.</p>
  ${d.length>4?'<div class="search" style="margin-top:12px"><input id="wq" type="search" placeholder="Cari nama" aria-label="Cari orang"></div>':''}
  <div class="list" id="wl" style="margin-top:12px">${rows}</div>
  <p class="note">Nomor WhatsApp diisi lewat Lainnya &gt; Tagihan &amp; Pengingat &gt; Ubah.</p>
  <button class="cta" data-close style="background:var(--line);color:var(--ink);margin-top:8px">Tutup</button>`;
  $('#scrim').classList.add('show')}
function viewDebtors(){
  const all=debtors(),q=(S.dq||'').trim().toLowerCase(),l=q?all.filter(({b})=>[b.name,b.address,b.item].some(v=>(v||'').toLowerCase().includes(q))):all;
  const card=({b,i,r})=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><b style="font-size:15px">${esc(b.name)}</b><small style="font-weight:600;color:${r<=0?'#1f7a63':i.c};text-align:right">${r<=0?'Lunas':i.t}</small></div>
    <div class="kv"><span>Alamat</span><b>${esc(b.address||'-')}</b></div>
    <div class="kv"><span>Nama barang</span><b>${esc(b.item||'-')}${b.qty?' × '+Number(b.qty).toLocaleString('id-ID'):''}</b></div>
    <div class="kv"><span>Total</span><b>${rp(b.amount)}</b></div>
    <div class="kv"><span>Sisa</span><b style="color:${r<=0?'#1f7a63':'#d64545'}">${r<=0?'Rp 0':rp(r)}</b></div>
    <div class="kv"><span>Tanggal hutang</span><b>${b.date?fd(b.date):'-'}</b></div>
    <div class="kv"><span>Jatuh tempo</span><b>${b.due?fd(b.due):'Tiap tgl '+b.day}</b></div>${r>0?cicilRow(b):''}</div>`;
  return `<button class="back" data-sub="">‹ Beranda</button><h1>Orang berhutang</h1>
  <div style="display:flex;align-items:center;gap:10px;margin-top:14px"><div class="search" style="margin:0;flex:1;min-width:0"><input id="dq" type="search" placeholder="Cari nama, alamat, barang" value="${esc(S.dq||'')}" aria-label="Cari orang berhutang"></div><button data-wapick aria-label="Ingatkan via WhatsApp" style="flex:none;width:46px;height:46px;border-radius:16px;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(37,211,102,.7)"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-1.9.9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.5.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.3z"/></svg></button></div>
  <p class="note" style="margin:10px 0 0">${all.filter(x=>x.r>0).length} orang belum lunas${q?` · ${l.length} hasil`:''}</p>
  <div style="margin-top:6px">${l.map(card).join('')||`<div class="empty">${all.length?'Tidak ada hasil.':'Belum ada orang yang berhutang.'}</div>`}</div>`;
}
function viewHome(){
  if(S.sub==='debtors')return viewDebtors();
  const m=monthKey(today()),s=stats(m),tot=Repo.wallets.reduce((a,w)=>a+Repo.walletBal(w),0);
  const pct=s.inc>0?Math.min(100,Math.round(s.out/s.inc*100)):0;
  const C=2*Math.PI*30,off=C*(1-pct/100);
  const msg=s.inc>0?`Kamu sudah memakai ${pct}% dari pemasukan bulan ini.`:'Belum ada pemasukan bulan ini.';

let F=null;
function openSheet(id){
  const t=id?Repo.items.find(x=>x.id===id):null;
  F=t?{...t}:{id:uid(),type:'out',amount:'',categoryId:catsOf('out')[0].id,walletId:Repo.wallets[0].id,note:'',date:S.tab==='hist'?S.sel:today(),createdAt:Date.now()};

}
function drawSheet(){
  const isT=F.type==='transfer',towal=Repo.wallets.map(w=>`<button class="chip ${F.toWalletId===w.id?'on':''}" data-towal="${w.id}">${esc(w.name)}</button>`).join('');
  const cats=catsOf(F.type).map(c=>`<button class="chip ${F.categoryId===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('');
  const wal=Repo.wallets.map(w=>`<button class="chip ${F.walletId===w.id?'on':''}" data-wal="${w.id}">${esc(w.name)}</button>`).join('');
  $('#sheet').innerHTML=`<h2 style="margin:0">${F.isNew?'Catat transaksi':'Ubah transaksi'}</h2>
  <div class="seg"><button class="${F.type==='out'?'on':''}" data-type="out">Pengeluaran</button><button class="${F.type==='in'?'on in':''}" data-type="in">Pemasukan</button><button class="${F.type==='transfer'?'on':''}" data-type="transfer">Transfer</button></div>
  <label for="fa">Jumlah (Rp)</label><input class="f amt" id="fa" inputmode="numeric" placeholder="0" value="${F.amount===''?'':Number(F.amount).toLocaleString('id-ID')}">
  ${isT?'':`<label>Kategori</label><div class="cats">${cats}</div>`}
  <label>${isT?'Dari dompet':'Dompet'}</label><div class="cats">${wal}</div>${isT?`<label>Ke dompet</label><div class="cats">${towal}</div>`:''}
  <label for="fn">Catatan</label><input class="f" id="fn" maxlength="60" placeholder="Contoh: makan siang" value="${esc(F.note)}">
  <label for="fd">Tanggal</label><input class="f" id="fd" type="date" value="${F.date}">

  ${F.isNew?'':'<div class="btns"><button class="warn" data-del>Hapus</button></div>'}

function syncF(){F.note=$('#fn').value;F.amount=parseInt($('#fa').value.replace(/\D/g,''),10)||'';F.date=$('#fd').value||F.date}
function closeSheet(){$('#scrim').classList.remove('show');F=null;S.lockSheet=false}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}

/* ===== Event ===== */
document.addEventListener('click',async e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g('[data-tab]')){S.tab=el.dataset.tab;S.sub='';render();$('#view').scrollTop=0}
  else if(el=g('[data-sub]')){S.sub=el.dataset.sub;S.wid=null;render();$('#view').scrollTop=0}
  else if(g('[data-add]'))openSheet();
  else if(el=g('[data-edit]'))openSheet(el.dataset.edit);
  else if(el=g('[data-day]')){S.sel=el.dataset.day;render()}
  else if(el=g('[data-wk]')){const d=parse(S.sel);d.setDate(d.getDate()+7*Number(el.dataset.wk));S.sel=iso(d);render()}
  else if(el=g('[data-filter]')){S.filter=el.dataset.filter;render()}
  else if(el=g('[data-type]')){syncF();const ty=el.dataset.type;if(ty==='transfer'&&Repo.wallets.length<2){toast('Tambah minimal 2 dompet dulu');return}F.type=ty;if(ty==='transfer'){delete F.categoryId;F.toWalletId=F.toWalletId||(Repo.wallets.find(w=>w.id!==F.walletId)||{}).id}else{F.categoryId=catsOf(ty)[0].id;delete F.toWalletId}drawSheet()}
  else if(el=g('[data-cat]')){syncF();F.categoryId=el.dataset.cat;drawSheet()}
  else if(el=g('[data-wal]')){syncF();F.walletId=el.dataset.wal;if(F.type==='transfer'&&F.toWalletId===F.walletId)F.toWalletId=(Repo.wallets.find(w=>w.id!==F.walletId)||{}).id;drawSheet()}
  else if(el=g('[data-towal]')){syncF();F.toWalletId=el.dataset.towal;if(F.toWalletId===F.walletId)F.walletId=(Repo.wallets.find(w=>w.id!==F.toWalletId)||{}).id;drawSheet()}
  else if(g('[data-close]')||(e.target.id==='scrim'&&!S.lockSheet))closeSheet();
  else if(g('[data-save]')){
    const amt=parseInt($('#fa').value.replace(/\D/g,''),10);
    if(!amt){toast('Isi jumlah lebih dari 0');$('#fa').focus();return}
    if(F.type==='transfer'&&(!F.toWalletId||F.toWalletId===F.walletId)){toast('Pilih dua dompet berbeda');return}
    const{isNew,...t}=F;t.amount=amt;t.note=$('#fn').value.trim();t.date=$('#fd').value||today();
    await Repo.upsert(t);S.sel=t.date;closeSheet();render();toast(overBudget(t)||'Tersimpan');
  }
  else if(g('[data-del]')){await Repo.remove(F.id);closeSheet();render();toast('Terhapus')}
  else if(g('[data-syncnow]')){Sync.start()}

/* ===== Kripto =====
   Kata sandi & PIN di-hash dengan PBKDF2-SHA256. Data yang dikirim ke cloud dienkripsi AES-256-GCM di perangkat,
   kuncinya diturunkan dari nama + kata sandi dan tidak pernah dikirim. Server hanya melihat teks acak. */
const CR={

  b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u},
  hex:u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join(''),
  sha256(m){const K=CR.K||(CR.K=(()=>{const k=[];let n=2;while(k.length<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p)k.push(Math.floor((Math.cbrt(n)%1)*4294967296)>>>0);n++}return k})());
    const H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],L=m.length,t=(L+9+63)&~63,b=new Uint8Array(t);b.set(m);b[L]=128;
    const dv=new DataView(b.buffer);dv.setUint32(t-8,Math.floor(L/536870912));dv.setUint32(t-4,(L<<3)>>>0);const w=new Uint32Array(64);
    for(let o=0;o<t;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
      for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))>>>0}
      let[a,c,d,e,f,g,h,j]=H;
      for(let i=0;i<64;i++){const T1=(j+(((f>>>6)|(f<<26))^((f>>>11)|(f<<21))^((f>>>25)|(f<<7)))+((f&g)^(~f&h))+K[i]+w[i])>>>0,T2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&c)^(a&d)^(c&d)))>>>0;
        j=h;h=g;g=f;f=(e+T1)>>>0;e=d;d=c;c=a;a=(T1+T2)>>>0}
      H[0]=(H[0]+a)>>>0;H[1]=(H[1]+c)>>>0;H[2]=(H[2]+d)>>>0;H[3]=(H[3]+e)>>>0;H[4]=(H[4]+f)>>>0;H[5]=(H[5]+g)>>>0;H[6]=(H[6]+h)>>>0;H[7]=(H[7]+j)>>>0}
    const out=new Uint8Array(32),ov=new DataView(out.buffer);H.forEach((x,i)=>ov.setUint32(i*4,x));return out},
  hmac(key,msg){if(key.length>64)key=CR.sha256(key);const ik=new Uint8Array(64+msg.length),ok=new Uint8Array(96);
    for(let i=0;i<64;i++){const k=key[i]||0;ik[i]=k^54;ok[i]=k^92}ik.set(msg,64);ok.set(CR.sha256(ik),64);return CR.sha256(ok)},
  pbkdfJs(pw,salt,iter,len){const out=new Uint8Array(Math.ceil(len/32)*32);

  async pbkdf2(pw,salt,iter,len){const e=new TextEncoder();

  async enc(key,owner,obj){const iv=crypto.getRandomValues(new Uint8Array(12)),ad=new TextEncoder().encode(owner),

    let f=0;try{f=(parseInt(localStorage.getItem(fk),10)||0)+1;localStorage.setItem(fk,String(f))}catch(e){}
    if(f>=5){try{localStorage.removeItem(fk)}catch(e){}this.logout();const er=$('#aerr');if(er)er.textContent='Terlalu banyak PIN salah. Masuk dengan nama dan kata sandi.';return}
    try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
    const dd=$('#pdots'),er=$('#perr');if(er)er.textContent='PIN salah. Sisa percobaan '+(5-f)+'.';
    if(dd){dd.classList.remove('bad');void dd.offsetWidth;dd.classList.add('bad')}
    await new Promise(r=>setTimeout(r,350));this.pb='';this.pinUpdate();if(dd)dd.classList.remove('bad')},
  forgot(){const a=this.pending||this.user;if(a){Sync.forget(a.id);try{localStorage.removeItem(this.pk(a.id))}catch(e){}}this.logout();const er=$('#aerr');if(er)er.textContent='Masuk dengan nama dan kata sandi, lalu buat PIN baru.'},
  lock(){if(!this.user||!this.hasPin(this.user))return;this.pending=this.user;closeSheet();this.drawPin('verify')},
  async changePin(){const e=$('#perr2'),err=m=>{if(e)e.textContent=m},u=this.user,c=$('#pc').value,n=$('#pn').value,n2=$('#pn2').value,p=this.getPin(u);
    if(!await this.pinOk(p,c))return err('PIN saat ini salah.');
    if(!/^\d{6}$/.test(n))return err('PIN baru harus 6 angka.');
    if(n!==n2)return err('Ulangi PIN baru tidak sama.');
    await this.setPin(u,n);render();toast('PIN diubah')},
  GUEST:{id:'guest',name:'Tamu',guest:true},
  async enterGuest(){this.user=this.GUEST;LocalStore.key='catatuang:u:guest';await Repo.load();applyTheme();S.tab='home';S.sub='';render();Sync.signOut();Sync.set('login','Belum daftar. Daftar atau masuk untuk mengaktifkan sinkronisasi.')},
  openAuth(mode){this.mode=mode||(this.list().length?'login':'reg');closeSheet();this.draw();const a=$('#auth');a.classList.remove('rise','out');void a.offsetWidth;a.classList.add('rise');setTimeout(()=>a.classList.remove('rise'),800)},
  genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(20));let c='';r.forEach((x,i)=>{c+=A[x%32];if(i%5===4&&i<19)c+='-'});return c},
  async makeRecovery(pw){const e=$('#rerr'),err=m=>{if(e)e.textContent=m;else toast(m)};
    if(!Sync.on()||!CR.ok())return err('Kode pemulihan butuh sinkronisasi aman (https atau APK).');
    if(!navigator.onLine)return err('Hubungkan internet dulu.');
    if(!Sync.owner||!Sync.key||!Sync.raw)return err('Keluar lalu masuk lagi dulu, lalu coba lagi.');
    if(pw!==null&&!await this.pwOk(this.user,pw))return err(pw?'Kata sandi salah.':'Isi kata sandi saat ini.');
    err('Membuat kode…');
    try{const code=this.genCode(),rd=await Sync.recDerive(code),old=Repo.settings.rec,body=JSON.stringify(await Sync.pack(rd.owner,rd.key,Sync.recBlob()));
      let rid=null;if(old){const rows=await Sync.fetchAll(old.o);if(rows.length)rid=rows[0].id}
      if(rid)await Sync.api('?id=eq.'+rid,{method:'PATCH',headers:{Prefer:'return=minimal'},body});
      else await Sync.api('',{method:'POST',headers:{Prefer:'return=minimal'},body});
      Repo.settings.rec={o:rd.owner,k:CR.b64e(rd.raw),at:today()};await Repo.persist();err('');
      S.lockSheet=true;
      $('#sheet').innerHTML=`<h2 style="margin:0">Kode pemulihan</h2><p class="note" style="margin:6px 0 12px">Simpan kode ini di tempat aman (catatan pribadi, foto, atau kertas). Kode ini satu-satunya cara memulihkan akun kalau kamu lupa kata sandi. Siapa pun yang memegang kode bisa mengambil alih akunmu, jadi jangan dibagikan.</p>
      <div class="card" style="font-family:ui-monospace,Menlo,monospace;font-size:19px;letter-spacing:1px;text-align:center;font-weight:700;user-select:all;padding:18px 8px">${code}</div>
      <div class="btns"><button data-copyrec="${code}">Salin kode</button></div>
      <button class="cta" data-close>Sudah saya simpan</button>`;$('#scrim').classList.add('show')}
    catch(x){err('Gagal membuat kode. Coba lagi.')}},
  async recover(){const err=m=>{const e=$('#aerr');if(e)e.textContent=m;const c=$('#acard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')};
    const code=($('#rc').value||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase(),p=$('#ap').value;
    if(code.length!==20)return err('Kode pemulihan harus 20 karakter.');
    if(p.length<8)return err('Kata sandi baru minimal 8 karakter.');
    if(p!==$('#ap2').value)return err('Ulangi kata sandi tidak sama.');
    if(!Sync.on()||!CR.ok())return err('Pemulihan butuh koneksi aman (https atau APK).');
    if(!navigator.onLine)return err('Hubungkan internet dulu.');
    $('#aerr').textContent='Memeriksa kode…';
    try{const rd=await Sync.recDerive(code),rows=await Sync.fetchAll(rd.owner);let blob=null,rid=null;
      for(const r of rows){const d=await Sync.unpack(rd.owner,rd.key,r);if(d&&d.owner&&d.raw){blob=d;rid=r.id;break}}
      if(!blob)return err('Kode pemulihan salah.');
      const raw=CR.b64d(blob.raw),d1={owner:blob.owner,raw,key:await CR.aesKey(raw)},d2=await Sync.derive(blob.name,p);
      if(d2.owner!==d1.owner){if(await Sync.exists(d2.owner))return err('Kata sandi itu sudah dipakai akun lain. Pakai kata sandi lain.');await Sync.rekey(d1,d2)}
      await Sync.api('?id=eq.'+rid,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(await Sync.pack(rd.owner,rd.key,{name:blob.name,owner:d2.owner,raw:CR.b64e(d2.raw)}))});
      const L=this.list();let a=L.find(x=>x.name.toLowerCase()===blob.name.toLowerCase());
      if(a){a.salt=uid();a.it=pwIter();a.v=2;a.hash=await pwHash(p,a.salt,a.it)}else{a=await this.mkAcc(blob.name,p);L.push(a)}
      this.save(L);Sync.pw=p;this.mode='login';return this.enter(a)}
    catch(x){return err('Gagal memulihkan. Coba lagi.')}},
  async enter(a){this.user=a;try{localStorage.setItem(this.ses,a.id)}catch(e){}
    LocalStore.key='catatuang:u:'+a.id;await Repo.load();applyTheme();S.tab='home';S.sub='';render();Sync.start();
    if(!this.hasPin(a)){this.drawPin('create');return}
    this.hideAuth()},
  logout(){if(this.user)Sync.forget(this.user.id);try{localStorage.removeItem(this.ses)}catch(e){}Sync.signOut();this.user=null;Repo.items=[];Repo.shop=[];Repo.bills=[];Repo.goals=[];Repo.budgets=[];closeSheet();
    Object.assign(S,{tab:'home',sub:'',q:'',filter:'all',sel:today()});$('#view').innerHTML='';this.mode='login';this.draw()}
};
document.addEventListener('change',async e=>{const t=e.target;if(t.id!=='rph'&&t.id!=='eph')return;const f=t.files&&t.files[0];if(!f)return;
  let d;try{d=await resizePhoto(f)}catch(x){return toast('Foto tidak bisa dibaca')}
  if(t.id==='rph'){Auth.photo=d;const v=$('#rpv');v.style.backgroundImage='url('+d+')';v.classList.add('has');v.innerHTML='';$('#rpt').textContent='Ketuk untuk ganti foto';const er=$('#aerr');if(er)er.textContent=''}
  else{const L=Auth.list(),a=L.find(x=>x.id===Auth.user.id);if(!a)return;a.photo=d;Auth.save(L);Auth.user=a;render();toast('Foto profil diperbarui')}});
document.addEventListener('input',e=>{if(['pc','pn','pn2'].includes(e.target.id))e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
document.addEventListener('keydown',e=>{if(!$('#auth').classList.contains('show')||!$('#pinpad')||e.target.closest('input'))return;if(/^\d$/.test(e.key))Auth.pinKey(e.key);else if(e.key==='Backspace')Auth.pinKey('b')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)Auth.hid=Date.now();else if(Auth.hid&&Date.now()-Auth.hid>60000){Auth.hid=0;if(!$('#auth').classList.contains('show'))Auth.lock()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='aform')Auth.submit()});
(async()=>{let id=null;try{id=localStorage.getItem(Auth.ses)}catch(e){}
  const a=Auth.list().find(x=>x.id===id);
  if(a){if(Auth.hasPin(a)){Auth.pending=a;Auth.drawPin('verify')}else await Auth.enter(a)}
  else if(Auth.list().length)Auth.draw();
  else{await Auth.enterGuest();let seen=false;try{seen=sessionStorage.getItem('catatuang:nag')==='1'}catch(e){}
    if(!seen)setTimeout(()=>{if(Auth.user&&Auth.user.guest&&!$('#auth').classList.contains('show')&&!$('#scrim').classList.contains('show')){try{sessionStorage.setItem('catatuang:nag','1')}catch(e){}Auth.openAuth('reg')}},4000)}})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
